name: Commercial staging checks
on:
  push:
    branches: [feature/commercial-readiness-v1]
permissions:
  contents: read
concurrency:
  group: trainer-commercial-staging
  cancel-in-progress: true
jobs:
  checks:
    # Standard public-repo runner only; never deploy or use secrets.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commercial worker and curriculum checks
        run: |
          node commercial/tests.mjs
          node commercial/extended-tests.mjs
          node commercial/auth-email-tests.mjs
          python3 commercial/test-writing.py
          python3 commercial/build.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('commercial/dist')
          assert len(json.loads((d/'demo.json').read_text()))==13
          assert len(json.loads((d/'demo-exec.json').read_text())['tests'])==3
          assert not (d/'runtime/lessons.json').exists()
          assert (d/'app/runtime/lessons.json').is_file()
          print('Free/premium asset layout verified')
          PY
          rm -rf commercial/dist
      - name: Prepare browser without modifying repository
        run: |
          npm install --prefix /tmp/trainer-deps --no-package-lock --no-save playwright@1.51.1
          /tmp/trainer-deps/node_modules/.bin/playwright install --with-deps chromium
          CHROMIUM_PATH=$(NODE_PATH=/tmp/trainer-deps/node_modules node -p "require('playwright').chromium.executablePath()")
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Full original regression
        env:
          NODE_PATH: /tmp/trainer-deps/node_modules
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/trainer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/test.cjs --browser
