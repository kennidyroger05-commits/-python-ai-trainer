<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta — Python AI Trainer</title><link rel="stylesheet" href="/portal.css"><script defer src="/account.js"></script></head><body><main><a href="/">Voltar ao login</a><h1>Minha conta</h1><p id="status" role="status">Verificando disponibilidade…</p><section id="account" hidden><form id="form"><label>O que deseja fazer?<select id="mode" name="mode"><option value="signup">Criar conta</option><option value="confirm">Confirmar e-mail com código</option><option value="recover">Solicitar código para nova senha</option><option value="reset">Alterar senha com código</option></select></label><label>E-mail<input type="email" name="email" maxlength="254" autocomplete="username" required></label><label id="passLabel">Senha (12 a 128 caracteres)<input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label id="codeLabel" hidden>Código recebido<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label><button id="send">Continuar</button></form></section><p>Não envie sua senha ou códigos para o suporte.</p></main></body></html>
