<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Python AI Trainer</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">Python aplicado a IA</p><h1>Python AI Trainer</h1></div><strong id="xp">0 XP</strong></header>
<section id="home"><h2>Seu treino</h2><p id="homeProgress"></p><button id="continue" class="primary">Continuar treino</button><button id="reset">Resetar progresso</button></section>
<section id="mission" hidden><button id="homeButton">← Início</button><div class="progress-card"><p id="module"></p><p id="counter"></p><div class="progress-track"><div id="bar" class="progress-bar"></div></div></div><article class="mission-card"><h2 id="title"></h2><p id="prompt"></p><pre id="context"></pre><pre id="code"></pre><div id="answer" class="answer"></div><pre id="assembled" class="code-display" hidden></pre><div id="legend" class="legend"></div><div class="actions"><button id="hint">Dica 1</button><button id="submit" class="primary">Responder</button></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary" hidden>Próxima missão</button></article><button id="restartModule">Recomeçar módulo</button></section></main>
<script src="game.js"></script><script src="app.js"></script></body></html>
