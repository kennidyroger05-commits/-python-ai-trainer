<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Python AI Trainer</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="topbar"><div><p id="tagline" class="eyebrow">Python aplicado a IA</p><h1>Python AI Trainer</h1></div><label for="language" id="languageLabel">Idioma</label><select id="language"><option value="pt">Português</option><option value="mixed">Misto</option><option value="en">English</option></select><strong id="xp">0 XP</strong></header>
<section id="home"><h2 id="homeTitle">Seu treino</h2><p id="homeProgress"></p><button id="continue" class="primary">Continuar treino</button><button id="reviewButton"></button><button id="debugButton"></button><button id="aiLabButton"></button><p id="reviewNotice" aria-live="polite"></p><div id="debugList" hidden></div><button id="reset">Resetar progresso</button></section>
<section id="mission" hidden><button id="homeButton">← Início</button><div class="progress-card"><p id="module"></p><p id="counter"></p><div class="progress-track"><div id="bar" class="progress-bar"></div></div></div><article class="mission-card"><h2 id="title"></h2><p id="prompt"></p><section id="debugPanel" hidden><p id="debugNotice"></p><pre id="debugError"></pre><div id="investigate"></div><p id="investigationFeedback" aria-live="polite"></p></section><pre id="context"></pre><pre id="code"></pre><div id="answer" class="answer"></div><pre id="assembled" class="code-display" hidden></pre><div id="legend" class="legend"></div><section id="glossary" hidden><div id="termDetails"></div><button id="knowTerm"></button><button id="closeGlossary"></button></section><button id="simulate" hidden></button><section id="simulation" hidden><p id="simLabel"></p><pre id="simCode"></pre><p id="simExplanation" aria-live="polite"></p><h3 id="variablesLabel"></h3><pre id="simVariables"></pre><h3 id="outputLabel"></h3><pre id="simOutput"></pre><div class="actions"><button id="prevLine"></button><button id="nextLine"></button><button id="resetSim"></button></div></section><div class="actions"><button id="hint">Dica 1</button><button id="submit" class="primary">Responder</button></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary" hidden>Próxima missão</button></article><button id="restartModule">Recomeçar módulo</button></section><section id="aiLab" hidden><button id="labHome"></button><h2 id="labTitle"></h2><p id="labNotice"></p><div id="labChoices" class="actions"></div><section id="labFlow" hidden><h3 id="labStage"></h3><pre id="labData"></pre><p id="labExplanation"></p><div id="labActions" class="answer"></div><p id="labFeedback" aria-live="polite"></p><div class="actions"><button id="labPrev"></button><button id="labNext"></button><button id="labRestart"></button></div></section></section></main>
<script src="core/progress.js"></script><script src="core/session.js"></script><script src="core/simulation.js"></script><script src="core/content.js"></script><script src="labs.js"></script><script src="game.js"></script><script src="language.js"></script><script src="app.js"></script></body></html>
