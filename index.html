<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Python AI Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Python para IA</p>
        <h1>Python AI Trainer</h1>
      </div>
      <div class="xp-box">XP <strong id="xp">0</strong></div>
    </header>

    <section class="progress-card">
      <div class="progress-labels">
        <span id="missionCounter">Missão 1 de 10</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <section class="game-grid">
      <div class="mission-card">
        <p id="topic" class="eyebrow"></p>
        <h2 id="title"></h2>
        <p id="description" class="description"></p>

        <div class="data-card">
          <span>Dados disponíveis</span>
          <pre><code id="starterCode"></code></pre>
        </div>

        <h3>Peças disponíveis</h3>
        <div id="tokenBank" class="token-bank"></div>

        <h3>Seu código</h3>
        <div id="codeDisplay" class="code-display" aria-live="polite"></div>

        <div class="actions">
          <button id="runBtn" class="primary">Executar</button>
          <button id="undoBtn">Apagar última</button>
          <button id="clearBtn">Limpar</button>
          <button id="hintBtn">Dica</button>
        </div>

        <div id="feedback" class="feedback" aria-live="polite">Monte a solução usando os blocos acima.</div>
        <button id="nextBtn" class="primary next hidden">Próxima missão</button>
      </div>

      <aside class="legend-card">
        <h3>Ferramentas desta missão</h3>
        <div id="legend"></div>
        <div class="why-card">
          <strong>Por que isso importa em IA?</strong>
          <p id="why"></p>
        </div>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
